<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプルブロック崩し（リトライ機能付き）</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
        }
        canvas {
            background: #ecf0f1;
            display: block;
            border-radius: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="480" height="320"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // ボールの設定
    let x, y;
    let dx = 3;
    let dy = -3;
    const ballRadius = 10;

    // パドルの設定
    const paddleHeight = 10;
    const paddleWidth = 75;
    let paddleX = (canvas.width - paddleWidth) / 2;

    // キーボード操作用のフラグ
    let rightPressed = false;
    let leftPressed = false;

    // ゲーム状態の管理
    let isPlaying = false;   // ボールが動いているか
    let isGameOver = false;  // ゲームオーバー状態か
    let isGameClear = false; // ゲームクリア状態か

    // ブロックの設定
    const brickRowCount = 4;
    const brickColumnCount = 5;
    const brickWidth = 75;
    const brickHeight = 20;
    const brickPadding = 10;
    const brickOffsetTop = 30;
    const brickOffsetLeft = 30;

    // スコア
    let score = 0;

    // ブロック配列の初期化
    const bricks = [];
    for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
            bricks[c][r] = { x: 0, y: 0, status: 1 };
        }
    }

    // キーボードのイベントリスナー
    document.addEventListener("keydown", keyDownHandler, false);
    document.addEventListener("keyup", keyUpHandler, false);

    function keyDownHandler(e) {
        if (e.key === "Right" || e.key === "ArrowRight") {
            rightPressed = true;
        } else if (e.key === "Left" || e.key === "ArrowLeft") {
            leftPressed = true;
        } else if (e.key === " " || e.code === "Space") {
            // スペースキーが押された時の処理
            if (!isPlaying) {
                if (isGameOver || isGameClear) {
                    resetGame(); // ゲームオーバー・クリア時はリセット
                }
                isPlaying = true; // ボールを発射
                dx = 3;
                dy = -3;
            }
        }
    }

    function keyUpHandler(e) {
        if (e.key === "Right" || e.key === "ArrowRight") {
            rightPressed = false;
        } else if (e.key === "Left" || e.key === "ArrowLeft") {
            leftPressed = false;
        }
    }

    // ゲームのリセット処理
    function resetGame() {
        score = 0;
        isGameOver = false;
        isGameClear = false;
        paddleX = (canvas.width - paddleWidth) / 2;
        
        for (let c = 0; c < brickColumnCount; c++) {
            for (let r = 0; r < brickRowCount; r++) {
                bricks[c][r].status = 1;
            }
        }
    }

    // 衝突判定関数
    function collisionDetection() {
        for (let c = 0; c < brickColumnCount; c++) {
            for (let r = 0; r < brickRowCount; r++) {
                let b = bricks[c][r];
                if (b.status === 1) {
                    if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                        dy = -dy;
                        b.status = 0;
                        score++;
                        if (score === brickRowCount * brickColumnCount) {
                            isGameClear = true;
                            isPlaying = false; // ボールを止める
                        }
                    }
                }
            }
        }
    }

    function drawBall() {
        ctx.beginPath();
        ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
        ctx.fillStyle = "#e74c3c";
        ctx.fill();
        ctx.closePath();
    }

    function drawPaddle() {
        ctx.beginPath();
        ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
        ctx.fillStyle = "#3498db";
        ctx.fill();
        ctx.closePath();
    }

    function drawBricks() {
        for (let c = 0; c < brickColumnCount; c++) {
            for (let r = 0; r < brickRowCount; r++) {
                if (bricks[c][r].status === 1) {
                    let brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                    let brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                    bricks[c][r].x = brickX;
                    bricks[c][r].y = brickY;
                    ctx.beginPath();
                    ctx.rect(brickX, brickY, brickWidth, brickHeight);
                    ctx.fillStyle = "#2ecc71";
                    ctx.fill();
                    ctx.closePath();
                }
            }
        }
    }

    function drawScore() {
        ctx.font = "16px sans-serif";
        ctx.fillStyle = "#34495e";
        ctx.fillText("スコア: " + score, 8, 20);
    }

    // メッセージの描画
    function drawMessage() {
        if (!isPlaying) {
            ctx.font = "bold 18px sans-serif";
            ctx.fillStyle = "#e74c3c";
            ctx.textAlign = "center";
            if (isGameOver) {
                ctx.fillText("ゲームオーバー！", canvas.width / 2, canvas.height / 2 - 15);
                ctx.fillText("スペースキーでリトライ", canvas.width / 2, canvas.height / 2 + 15);
            } else if (isGameClear) {
                ctx.fillStyle = "#f1c40f";
                ctx.fillText("ゲームクリア！", canvas.width / 2, canvas.height / 2 - 15);
                ctx.fillText("スペースキーでもう一度遊ぶ", canvas.width / 2, canvas.height / 2 + 15);
            } else {
                ctx.fillStyle = "#34495e";
                ctx.fillText("スペースキーでスタート", canvas.width / 2, canvas.height / 2);
            }
            ctx.textAlign = "left"; // 設定を元に戻す
        }
    }

    // メインの描画関数
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        drawBricks();
        drawPaddle();
        drawScore();
        drawMessage();

        // パドルの移動（ボール停止中も動かせるように先に処理）
        if (rightPressed && paddleX < canvas.width - paddleWidth) {
            paddleX += 5;
        } else if (leftPressed && paddleX > 0) {
            paddleX -= 5;
        }

        // ボールの処理
        if (isPlaying) {
            drawBall();
            collisionDetection();

            // 壁の衝突判定
            if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
                dx = -dx;
            }
            if (y + dy < ballRadius) {
                dy = -dy;
            } 
            else if (y + dy > canvas.height - ballRadius) {
                if (x > paddleX && x < paddleX + paddleWidth) {
                    dy = -dy; // パドルで跳ね返す
                } else {
                    isGameOver = true;
                    isPlaying = false; // ミスしたらボールを止める
                }
            }

            x += dx;
            y += dy;
        } else {
            // 停止中はボールをパドルの中央に固定する
            x = paddleX + paddleWidth / 2;
            y = canvas.height - paddleHeight - ballRadius;
            drawBall();
        }

        requestAnimationFrame(draw);
    }

    // ゲームループ開始
    draw();
</script>

</body>
</html>
